; PlatformIO Projekt: ESP32 + Waveshare 5.83" e-Paper (G) Bildviewer
; https://www.waveshare.com/5.83inch-e-paper-g.htm

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Serieller Monitor
monitor_speed = 115200
; Upload-Geschwindigkeit - falls Upload fehlschlägt, auf 115200 reduzieren
upload_speed = 921600

; Dein Board: ESP32-S3-WROOM-1-N16R8 = 16MB Flash + 8MB Octal-PSRAM.
; Der generische Board-Eintrag "esp32-s3-devkitc-1" von PlatformIO geht
; standardmäßig von der Espressif-Referenzvariante N8 (8MB Flash, KEIN
; PSRAM) aus - das wird im Build-Log auch so angezeigt. Folgende Zeilen
; überschreiben das explizit auf dein tatsächliches N16R8-Modul:
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    ; PNGdec puffert standardmäßig nur Zeilen für ~320px breite Bilder.
    ; Unser Panel ist 648px breit - muss GLOBAL (nicht nur in main.cpp)
    ; gesetzt werden, da PNGdec.cpp separat kompiliert wird und ein
    ; einzelnes #define in main.cpp dafür nicht sichtbar ist.
    ; Großzügig bemessen (statt knapp am exakten Minimum), da ein zu
    ; knapper Puffer bei dieser Bibliothek zu Speicherüberschreibungen
    ; und Bildkorruption führen kann.
    -D PNG_MAX_BUFFERED_PIXELS=8192

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    bitbank2/PNGdec @ ^1.0.3